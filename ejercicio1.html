<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ejercicio 1 - Ejercicios para Ojo Vago - Movimiento Horizontal (Seguimiento Lateral)</title>
<meta name="description" content="Ejercicio visual interactivo para entrenar el ojo vago mediante seguimiento horizontal. Sigue la bola que se mueve de lado a lado para estimular la coordinación y la fijación visual.">

<style>
     #cronometro {
  font-weight: 600;
  min-width: 55px;
  text-align: center;
}
#cronometroBox {
  gap: 10px;
}

.Reset {
    background-color: transparent;
    color: white;
    padding: 0px;
    border: none;
    text-transform: uppercase;
    font-weight: 600;
}
 
  body {
    margin: 0;
    background: black;
    height: 100vh;
    overflow: hidden;
  }

  .escena {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #0f172a, #020617);
    overflow: hidden;
  }

  .bola {
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #3b82f6;
    box-shadow: 0 0 35px rgba(59, 130, 246, 1);

    top: 50%;
    transform: translateY(-50%);

    animation: mover-horizontal 4s linear infinite alternate;
  }

  @keyframes mover-horizontal {
    from { left: 0; }
    to   { left: calc(100vw - 70px); }
  }

  .toolbar {
    position: fixed;
    top: 20px;
    left: 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    z-index: 10;
  }

  .volver {
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }

  .velocidad-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.15);
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.4);
    backdrop-filter: blur(6px);
    color: white;
    font-size: 13px;
  }

  input[type="range"] {
    width: 120px;
    cursor: pointer;
  }

</style>

</head>
<body>


<div class="toolbar">
  <button class="volver" onclick="location.href='index.html'">⟵ Volver</button>

  <div class="velocidad-box">
    Velocidad
    <input id="velocidad" type="range" min="0.5" max="5" value="1" step="0.1">
  </div>
  
<div class="velocidad-box" id="cronometroBox">
  ⏱ <span id="cronometro">00:00</span>
  <button class="Reset" id="resetCrono">Reset</button>
</div>
</div>

<div class="escena">
  <div class="bola" id="bola"></div>
</div>

<script>
  const bola = document.getElementById("bola");
  const slider = document.getElementById("velocidad");

  slider.addEventListener("input", () => {
    const factor = slider.value;
    // duración original = 4s → nueva duración = 4 / factor
    bola.style.animationDuration = (4 / factor) + "s";
  });
</script>
<script src="js/main.js"></script>
</body>
</html>
